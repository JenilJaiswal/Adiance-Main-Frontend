name: Deploy Next.js App

on:
  push:
    branches:
      - nextjs-migration

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create env
        run: echo "${{ secrets.REACT_ENV }}" > .env

      - name: Build project
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Assemble standalone bundle
        run: |
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          if [ -d public ]; then cp -r public deploy/public; fi
          cp .env deploy/.env
          tar -czf release.tar.gz -C deploy .

      - name: Upload release to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "release.tar.gz"
          target: ${{ secrets.SERVER_PATH }}

      - name: Extract and restart on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            if ! command -v pm2 >/dev/null 2>&1; then
              for p in /usr/local/bin/pm2 /usr/bin/pm2 "$HOME/.nvm/versions/node"/*/bin/pm2; do
                if [ -x "$p" ]; then export PATH="$(dirname "$p"):$PATH"; break; fi
              done
            fi
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "ERROR: pm2 not installed on server. Run: npm i -g pm2"
              exit 1
            fi
            APP_DIR="${{ secrets.SERVER_PATH }}"
            RELEASE_DIR="$APP_DIR/current"
            BACKUP_DIR="$APP_DIR/previous"
            rm -rf "$BACKUP_DIR"
            if [ -d "$RELEASE_DIR" ]; then mv "$RELEASE_DIR" "$BACKUP_DIR"; fi
            mkdir -p "$RELEASE_DIR"
            tar -xzf "$APP_DIR/release.tar.gz" -C "$RELEASE_DIR"
            rm -f "$APP_DIR/release.tar.gz"
            cd "$RELEASE_DIR"
            pm2 reload adiance --update-env || pm2 start server.js --name adiance --time
            pm2 save
