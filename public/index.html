  <!-- Google Tag Manager - loads on first user interaction to avoid affecting LCP/TBT -->
  <script>
    (function () {
      var gtmLoaded = false;
      function loadGTM() {
        if (gtmLoaded) return;
        gtmLoaded = true;
        (function (w, d, s, l, i) {
          w[l] = w[l] || [];
          w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          var f = d.getElementsByTagName(s)[0],
            j = d.createElement(s),
            dl = l != 'dataLayer' ? '&l=' + l : '';
          j.async = true;
          j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
          f.parentNode.insertBefore(j, f);
        })(window, document, 'script', 'dataLayer', 'GTM-M7PMRCM');
        ['scroll', 'mousemove', 'keydown', 'touchstart', 'click'].forEach(function (e) {
          window.removeEventListener(e, loadGTM);
        });
      }
      // Load on first user interaction
      ['scroll', 'mousemove', 'keydown', 'touchstart', 'click'].forEach(function (e) {
        window.addEventListener(e, loadGTM, { once: true, passive: true });
      });
      // Fallback: load after 7 seconds even with no interaction
      setTimeout(loadGTM, 7000);
    })();
  </script>
